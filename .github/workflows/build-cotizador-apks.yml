name: Build cotizador APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Build S.I.D.C. APK
        working-directory: android-apps/sidc
        run: gradle --no-daemon assembleDebug
      - name: Build ROJO APK
        working-directory: android-apps/rojo
        run: gradle --no-daemon assembleDebug
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android-apps/sidc/app/build/outputs/apk/debug/app-debug.apk dist/cotizador-sidc-v1.0.9.apk
          cp android-apps/rojo/app/build/outputs/apk/debug/app-debug.apk dist/cotizador-rojo-v1.0.9.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cotizador-apks
          path: dist/*.apk
